<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Spinning Bitcoin logo in black and white</title>
  <desc id="desc">A black circular Bitcoin mark with a white Bitcoin symbol that rotates continuously.</desc>
  <style>
    #coin {
      transform-origin: 256px 256px;
      animation: spin 4.5s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #coin {
        animation: none;
      }
    }
  </style>
  <g id="coin">
    <circle cx="256" cy="256" r="252" fill="#111113"/>
    <circle cx="256" cy="256" r="226" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="10"/>
    <text x="256" y="326"
          text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif"
          font-size="290"
          font-weight="700"
          fill="#ffffff">&#8383;</text>
  </g>
</svg>
